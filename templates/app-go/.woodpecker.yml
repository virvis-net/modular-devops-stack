steps:
  test:
    image: golang:1.22-alpine
    commands:
      - go test ./...
    when:
      event:
        - push

  build:
    image: docker:24.0.0
    depends_on:
      - test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY: "localhost:__REGISTRY_PORT__"
    commands:
      - |
        set -eu

        IMAGE_TAG="$${CI_COMMIT_SHA}"
        IMAGE="$${REGISTRY}/app:$${IMAGE_TAG}"
        docker build -t "$$IMAGE" -f Dockerfile .
        docker push "$$IMAGE"

        REPO_DIGEST="$$(docker image inspect --format='{{index .RepoDigests 0}}' "$$IMAGE")"
        IMAGE_DIGEST="$${REPO_DIGEST##*@}"
        if ! printf '%s\n' "$$IMAGE_DIGEST" | grep -Eq '^sha256:[0-9a-f]{64}$'; then
          echo "ERROR: Could not determine the pushed image digest."
          exit 1
        fi
        printf '%s\n' "$$IMAGE_DIGEST" > .image_digest
    when:
      event:
        - push
      branch:
        - main

  update_gitops:
    image: alpine/git:latest
    depends_on:
      - build
    environment:
      GIT_SSH_KEY:
        from_secret: GIT_SSH_KEY
    commands:
      - |
        set -eu

        if [ -z "$${GIT_SSH_KEY:-}" ]; then
          echo "ERROR: GIT_SSH_KEY is not set."
          exit 1
        fi

        GIT_REPO_SSH="__GITOPS_REPO_URL__"
        TARGET_FILE="apps/app/overlays/staging/kustomization.yaml"
        IMAGE_DIGEST="$$(cat .image_digest)"

        mkdir -p /root/.ssh
        printf '%s\n' "$$GIT_SSH_KEY" > /root/.ssh/id_rsa
        chmod 600 /root/.ssh/id_rsa
        export GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=no -i /root/.ssh/id_rsa'

        git clone "$$GIT_REPO_SSH" gitops
        cd gitops

        if [ ! -f "$$TARGET_FILE" ]; then
          echo "Target file $$TARGET_FILE not found; aborting"
          exit 1
        fi

        sed -E -i \
          -e "s|^([[:space:]]*)newTag:.*|\1digest: $${IMAGE_DIGEST}|" \
          -e "s|^([[:space:]]*)digest:.*|\1digest: $${IMAGE_DIGEST}|" \
          "$$TARGET_FILE"

        if ! grep -Eq "^[[:space:]]*digest: $${IMAGE_DIGEST}$" "$$TARGET_FILE"; then
          echo "ERROR: Failed to set the staging image digest in $$TARGET_FILE"
          exit 1
        fi

        git add "$$TARGET_FILE"
        git config user.name "ci-bot"
        git config user.email "ci-bot@virvis.net"
        if ! git diff --cached --quiet; then
          git commit -m "ci: deploy app digest $${IMAGE_DIGEST} to staging"
        fi
        git push origin HEAD
    when:
      event:
        - push
      branch:
        - main
