steps:
  test:
    image: golang:1.22-alpine
    commands:
      - go test ./...

  build:
    image: docker:24.0.0
    depends_on:
      - test
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      REGISTRY: "localhost:__REGISTRY_PORT__"
    commands:
      - IMAGE_TAG=$${DRONE_BUILD_NUMBER:-$$(date +%s)}
      - echo "$${IMAGE_TAG}" > .image_tag
      - docker build -t $${REGISTRY}/app:$${IMAGE_TAG} -f Dockerfile .
      - docker push $${REGISTRY}/app:$${IMAGE_TAG}
    when:
      event:
        - push

  update_gitops:
    image: alpine/git:latest
    depends_on:
      - build
    environment:
      REGISTRY: "localhost:__REGISTRY_PORT__"
      GIT_SSH_KEY:
        from_secret: GIT_SSH_KEY
    commands:
      - |
        set -euxo pipefail

        if [ -z "$${GIT_SSH_KEY:-}" ]; then
          echo "ERROR: GIT_SSH_KEY is not set."
          exit 1
        fi

        GIT_REPO_SSH="__GITOPS_REPO_URL__"
        TARGET_FILE="clusters/__K3D_CLUSTER_NAME__/apps/app/kustomization.yaml"
        IMAGE_TAG="$$(cat .image_tag)"

        mkdir -p /root/.ssh
        printf '%s\n' "$$GIT_SSH_KEY" > /root/.ssh/id_rsa
        chmod 600 /root/.ssh/id_rsa
        export GIT_SSH_COMMAND='ssh -o StrictHostKeyChecking=no -i /root/.ssh/id_rsa'

        git clone "$$GIT_REPO_SSH" gitops
        cd gitops

        if [ ! -f "$$TARGET_FILE" ]; then
          echo "Target file $$TARGET_FILE not found; aborting"
          exit 1
        fi

        sed -E -i "s|^([[:space:]]*newTag:[[:space:]]*).*|\1\"$${IMAGE_TAG}\"|" "$$TARGET_FILE"

        git add "$$TARGET_FILE"
        git config user.name "ci-bot"
        git config user.email "ci-bot@example.com"
        git commit -m "ci: update app image to $${REGISTRY}/app:$${IMAGE_TAG}" || true
        git push origin HEAD
    when:
      event:
        - push
