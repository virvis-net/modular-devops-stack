name: mds-app-laravel-dev

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
      target: devcontainer
    init: true
    volumes:
      - ..:/var/www/html:cached
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: bash /var/www/html/.devcontainer/start.sh
    depends_on:
      mariadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      LOG_CHANNEL: stderr
      DB_CONNECTION: mysql
      DB_HOST: mariadb
      DB_PORT: "3306"
      DB_DATABASE: app
      DB_USERNAME: app
      DB_PASSWORD: app
      CACHE_STORE: redis
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      QUEUE_CONNECTION: redis
      OTEL_PHP_AUTOLOAD_ENABLED: "false"
