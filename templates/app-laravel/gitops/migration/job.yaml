apiVersion: batch/v1
kind: Job
metadata:
  name: app-migrate
spec:
  activeDeadlineSeconds: 600
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: migrate
          image: registry:5000/app:latest
          command:
            - php
            - artisan
            - migrate
            - --force
          env:
            - name: APP_ENV
              value: production
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: app
            - name: DB_USERNAME
              value: app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: password
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
