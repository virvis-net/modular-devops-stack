apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  template:
    spec:
      containers:
        - name: app
          env:
            - name: DB_CONNECTION
              value: mysql
            - name: DB_HOST
              value: mariadb
            - name: DB_PORT
              value: "3306"
            - name: DB_DATABASE
              value: app
            - name: DB_USERNAME
              value: app
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-database
                  key: password
            - name: CACHE_STORE
              value: redis
            - name: REDIS_CLIENT
              value: predis
            - name: REDIS_HOST
              value: redis
            - name: REDIS_PORT
              value: "6379"
