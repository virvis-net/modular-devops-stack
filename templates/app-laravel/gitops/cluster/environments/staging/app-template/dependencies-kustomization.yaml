apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging-app-dependencies
  namespace: flux-system
spec:
  interval: 1m
  path: ./apps/app/base/app-template/dependencies
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: staging
  timeout: 10m
  wait: true
