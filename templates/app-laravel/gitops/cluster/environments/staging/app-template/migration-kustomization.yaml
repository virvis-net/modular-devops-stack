apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging-app-migration-initial
  namespace: flux-system
spec:
  dependsOn:
    - name: staging-app-dependencies
  interval: 1m
  path: ./apps/app/overlays/staging/migration
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  targetNamespace: staging
  timeout: 15m
  wait: true
