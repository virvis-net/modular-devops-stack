apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: ${K3D_CLUSTER_NAME}

servers: 1
agents: 2

image: rancher/k3s:v1.29.4-k3s1

ports:
  - port: ${K3D_CLUSTER_PORT}:80
    nodeFilters:
      - loadbalancer
  - port: ${K3D_CLUSTER_PORT_SSL}:443
    nodeFilters:
      - loadbalancer

volumes:
  - volume: ${PWD}/cluster/provider/k3d/data:/var/lib/rancher/k3s/storage
    nodeFilters:
      - all

network: ${NETWORK_NAME}

registries:
  config: ${PWD}/cluster/provider/k3d/registries.yaml

options:
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
