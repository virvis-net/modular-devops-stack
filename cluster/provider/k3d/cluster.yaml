apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: mds-cluster

servers: 1
agents: 2

image: rancher/k3s:v1.29.4-k3s1

ports:
  - port: 80:80
    nodeFilters:
      - loadbalancer
  - port: 443:443
    nodeFilters:
      - loadbalancer

volumes:
  - volume: ${PWD}/cluster/provider/k3d/data:/var/lib/rancher/k3s/storage
    nodeFilters:
      - all

network: mds-network

registries:
  config: ${PWD}/cluster/provider/k3d/registries.yaml

options:
  k3s:
    extraArgs:
      - arg: "--disable=traefik"
        nodeFilters:
          - server:*
