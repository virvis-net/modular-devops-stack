apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: monitoring
data:
  datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus.monitoring.svc.cluster.local:9090
        isDefault: true
        editable: false
  dashboard-provider.yaml: |
    apiVersion: 1
    providers:
      - name: MDS
        orgId: 1
        folder: Modular DevOps Stack
        type: file
        disableDeletion: true
        editable: false
        options:
          path: /etc/grafana/provisioning/dashboards
  app-dashboard.json: |
    {
      "annotations": {
        "list": []
      },
      "editable": false,
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "targets": [
            {
              "expr": "sum by (environment) (rate(app_http_requests_total[5m]))",
              "legendFormat": "{{environment}}",
              "refId": "A"
            }
          ],
          "title": "HTTP request rate",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "targets": [
            {
              "expr": "histogram_quantile(0.95, sum by (le, environment) (rate(app_http_request_duration_seconds_bucket[5m])))",
              "legendFormat": "{{environment}} p95",
              "refId": "A"
            }
          ],
          "title": "HTTP request duration p95",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "prometheus"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "targets": [
            {
              "expr": "sum by (environment, status) (rate(app_http_requests_total[5m]))",
              "legendFormat": "{{environment}} HTTP {{status}}",
              "refId": "A"
            }
          ],
          "title": "HTTP request rate by status",
          "type": "timeseries"
        }
      ],
      "schemaVersion": 39,
      "title": "Application metrics",
      "uid": "mds-app-metrics",
      "version": 1
    }
