services:
  orchestration:
    image: docker.io/n8nio/n8n:latest
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PROTOCOL: http
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_BLOCK_ENV_ACCESS_IN_NODE: false
      GITEA_ACCESS_TOKEN: ${N8N_GITEA_TOKEN:-}
      GITEA_API_URL: http://host.docker.internal:${GITEA_HTTP_PORT:-3000}/api/v1
      GITEA_ORG: ${GITEA_ORG:-}
      GITEA_REPOSITORY: app
      GITEA_REPOSITORY_PATH: /projects/app
      GITEA_REPOSITORY_BRANCH: ${APP_BRANCH:-main}
      OPENHANDS_ACCESS_TOKEN: ${N8N_OPENHANDS_TOKEN:-}
      OPENHANDS_API_URL: http://host.docker.internal:${OPENHANDS_PORT:-8001}/api
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - shared

  orchestration-bootstrap:
    build:
      context: ./orchestration/provider/n8n/bootstrap
    depends_on:
      orchestration:
        condition: service_started
    restart: "no"
    environment:
      N8N_URL: http://orchestration:5678
      N8N_API_KEY: ${N8N_API_KEY}
    volumes:
      - ./orchestration/provider/n8n/workflows:/assets/workflows:ro
      - ./orchestration/provider/n8n/datatables:/assets/datatables:ro
    networks:
      - shared

volumes:
  n8n-data:
    name: ${STACK_NAME}-n8n-data
