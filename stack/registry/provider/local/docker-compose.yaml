services:
  registry:
    image: registry:2
    restart: unless-stopped
    ports:
      - "${REGISTRY_PORT}:5000"
    volumes:
      - registry-data:/var/lib/registry
      # For visible host-folder storage, replace the named volume above with:
      # - ${PWD}/stack/registry/provider/local/data:/var/lib/registry
    networks:
      - shared

volumes:
  registry-data:
    name: ${STACK_NAME}-registry-data
