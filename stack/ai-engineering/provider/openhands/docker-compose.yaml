services:
  coding-agent:
    image: ${OPENHANDS_IMAGE:-ghcr.io/openhands/agent-canvas:latest}
    restart: unless-stopped
    environment:
      AGENT_CANVAS_ALLOW_LAN_SESSION_KEY: "true"
      HOME: /home/openhands
      DOCKER_CONFIG: /tmp/docker-config
      XDG_CONFIG_HOME: /projects/.config
      GITEA_ACCESS_TOKEN: ${OPENHANDS_GITEA_TOKEN:-}
      GITEA_API_URL: http://host.docker.internal:${GITEA_HTTP_PORT:-3000}/api/v1
      WOODPECKER_TOKEN: ${OPENHANDS_WOODPECKER_TOKEN:-}
      WOODPECKER_API_URL: http://ci-server:8000/api
      GITEA_OWNER: ${GITEA_ORG:-}
      GITEA_REPOSITORY: app
      GIT_CONFIG_COUNT: "5"
      GIT_CONFIG_KEY_0: url.http://scm:3000/.insteadOf
      GIT_CONFIG_VALUE_0: http://localhost:${GITEA_HTTP_PORT:-3000}/
      GIT_CONFIG_KEY_1: http.http://scm:3000/.extraheader
      GIT_CONFIG_VALUE_1: "Authorization: token ${OPENHANDS_GITEA_TOKEN:-}"
      GIT_CONFIG_KEY_2: url.http://scm:3000/.insteadOf
      GIT_CONFIG_VALUE_2: ssh://git@localhost:${GITEA_SSH_PORT:-2222}/
      GIT_CONFIG_KEY_3: url.http://scm:3000/.insteadOf
      GIT_CONFIG_VALUE_3: ssh://git@${GITEA_SSH_DOMAIN:-host.docker.internal}:${GITEA_SSH_PORT:-2222}/
      GIT_CONFIG_KEY_4: safe.directory
      GIT_CONFIG_VALUE_4: ${WORKSPACE_DIRECTORY}/app
    ports:
      - "${OPENHANDS_PORT:-8001}:8000"
    volumes:
      - openhands-data:/home/openhands/.openhands
      - openhands-projects:/projects
      - ./ai-engineering/provider/openhands/agent-tools:/opt/ci:ro
      - ${WORKSPACE_DIRECTORY}:${WORKSPACE_DIRECTORY}
      - /var/run/docker.sock:/var/run/docker.sock
    user: "${OPENHANDS_UID:-1000}:${OPENHANDS_GID:-1000}"
    group_add:
      - "1001"
    depends_on:
      coding-agent-state-init:
        condition: service_completed_successfully
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - shared

  coding-agent-state-init:
    image: ${OPENHANDS_IMAGE:-ghcr.io/openhands/agent-canvas:latest}
    user: "0:0"
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "chown -R ${OPENHANDS_UID:-1000}:${OPENHANDS_GID:-1000} /home/openhands/.openhands /projects"
    volumes:
      - openhands-data:/home/openhands/.openhands
      - openhands-projects:/projects
    networks:
      - shared

  coding-agent-bootstrap:
    build:
      context: ./ai-engineering/provider/openhands/bootstrap
    depends_on:
      coding-agent:
        condition: service_started
    restart: "no"
    environment:
      OPENHANDS_URL: http://coding-agent:8000
      OPENHANDS_API_KEY: ${OPENHANDS_API_KEY}
      OLLAMA_PROVIDER: ${OLLAMA_PROVIDER:-container}
      WORKSPACE_DIRECTORY: ${WORKSPACE_DIRECTORY}
    volumes:
      - ./ai-engineering/provider/openhands/config:/assets:ro
    networks:
      - shared

volumes:
  openhands-data:
    name: ${STACK_NAME}-openhands-data
  openhands-projects:
    name: ${STACK_NAME}-openhands-projects
