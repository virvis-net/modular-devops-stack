services:
  scm:
    image: docker.gitea.com/gitea:28.2.0
    restart: always
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__ROOT_URL=${GITEA_ROOT_URL}
      - GITEA__webhook__ALLOWED_HOST_LIST=${GITEA_ALLOWED_HOSTS}
    volumes:
      - ${PWD}/source-control/provider/gitea/data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_HTTP_PORT}:3000"   # Web UI
      - "${GITEA_SSH_PORT}:22"      # SSH
    networks:
      - shared
